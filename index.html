<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פקעות">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/main.css?v=1.55">
<title>פקעות</title>
<style>
.lastScannedText{display:block;margin-top:5px;font-size:14px;font-weight:500;color:#9f9f9f;white-space:nowrap}
.lastScannedText.today{color:#3b82f6;font-weight:700}
.topVersion{font-size:12px;color:#aaa;font-weight:700;direction:ltr;white-space:nowrap}.topBarActions{display:flex;align-items:center;gap:8px;direction:ltr}
.shareBtn{width:42px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;background:#1d1d1d;color:#fff;border:1px solid #333;border-radius:14px}
.shareBtn svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.versionScreen{position:fixed;inset:0;z-index:100000;background:#000;color:#fff;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));direction:rtl}
.versionScreenHeader{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid #262626;flex:0 0 auto}
.versionScreenTitle{font-size:28px;font-weight:800;margin:0}
.versionCloseBtn{width:auto;padding:10px 16px;border-radius:14px;background:#222;color:#fff;border:1px solid #444;font-size:16px}
.versionScreenBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 0 4px;flex:1 1 auto}
.versionHistory{display:grid;gap:10px;text-align:right}
.versionEntry{border:1px solid #333;border-radius:16px;background:#141414;overflow:hidden}
.versionEntry summary{cursor:pointer;padding:15px 16px;font-size:18px;font-weight:800;color:#fff;list-style:none;position:relative;display:flex;align-items:center;justify-content:space-between}
.versionEntry summary::-webkit-details-marker{display:none}
.versionEntry summary::after{content:'⌄';color:#999;font-size:18px;transform:rotate(90deg);transition:transform .15s ease}
.versionEntry[open] summary::after{transform:rotate(0deg)}
.versionChanges{padding:0 16px 15px;color:#d0d0d0;font-size:16px;line-height:1.55;border-top:1px solid #282828}
.versionChange{display:block;margin-top:9px}
.versionEmpty{color:#aaa;font-size:17px;padding:24px 4px;text-align:center}
.departmentManagerSummary{border:1px solid #484848;border-radius:20px;background:#171717;color:#fff;padding:16px;margin:12px 0 16px;direction:rtl}
.departmentManagerSummary[hidden]{display:none!important}
.managerSummaryTitle{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:13px;font-size:18px}
.managerSummaryTitle span{font-size:12px;color:#bbb}
.managerSummaryGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.managerSummaryGrid>div{background:#262626;border-radius:13px;padding:12px 4px;text-align:center;min-width:0}
.managerSummaryGrid strong{font-size:26px;display:block;direction:ltr}
.managerSummaryGrid span{font-size:12px;color:#ccc;display:block;margin-top:4px}
.scanHistoryBtn{width:auto;background:none;border:0;padding:2px 0;color:#b5b5b5;font-size:15px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;direction:rtl}
.scanHistoryRow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 3px;border-bottom:1px solid #393939;font-size:15px}
.scanHistoryRow strong{direction:ltr;font-size:14px;white-space:nowrap}
.scanHistoryList{max-height:48vh;overflow:auto;margin-top:12px}
.scanHistoryNote{font-size:13px;color:#aaa;line-height:1.5}
.scanCorrectionTag{display:inline-block;margin-inline-start:15px;vertical-align:middle}
.itemMeta{display:flex;flex-direction:row;direction:rtl;align-items:center;justify-content:space-between;gap:10px}
.itemMeta.hasCorrection{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);column-gap:8px;align-items:center}
 .itemMeta.hasCorrection .num{grid-column:1;grid-row:1;order:unset!important;min-width:0;margin:0!important;justify-self:stretch;direction:ltr;text-align:right;font-size:clamp(12px,3.4vw,16px);white-space:nowrap}
.itemMeta.hasCorrection .scanCorrectionTag{grid-column:2;grid-row:1;justify-self:center;white-space:nowrap;margin:0!important;padding:5px 8px;border:1px solid #444;border-radius:10px;color:#d4d4d4;font-size:clamp(11px,3vw,14px);font-weight:700}
.itemMeta.hasCorrection .scanHistoryBtn{grid-column:3;grid-row:1;justify-self:end;order:unset!important;max-width:100%;font-size:clamp(12px,3.4vw,15px)!important}
.itemMeta .num{order:0!important;direction:ltr;text-align:right;margin:0 auto 0 0!important;min-width:0;overflow-wrap:anywhere}
.itemMeta .scanHistoryBtn{order:1!important;display:inline-block;width:auto!important;max-width:50%;flex:0 0 auto;min-height:0!important;margin:0!important;padding:2px 0!important;background:transparent!important;border:0!important;border-radius:0!important;color:#b5b5b5!important;font-size:15px!important;font-weight:500;line-height:1.4;white-space:nowrap;text-align:left;text-decoration:underline;text-underline-offset:3px}
.itemTop .star{display:block;width:28px!important;height:28px!important;padding:0!important;flex-shrink:0}
.contactDialog{max-height:85vh;overflow-y:auto}
.contactDialog .appDialogInput{font-size:18px;letter-spacing:0;text-align:right}
.contactDialog textarea{font-size:16px;width:100%}
.contactBubble{background:#252525;border-radius:12px;padding:10px;margin:7px 0;font-size:15px;overflow-wrap:anywhere}
.contactThread{max-height:30vh;overflow-y:auto;margin:14px 0}
.itemMeta{direction:rtl!important}.itemMeta .num{margin-left:auto!important;margin-right:0!important;text-align:right!important}.itemMeta.hasCorrection .num{margin:0!important;justify-self:stretch!important;text-align:right!important}
.contactNameRow{display:flex;align-items:stretch;gap:8px;direction:rtl;margin:6px 0 12px}
.contactNameRow #contactName{flex:1 1 auto;width:0;min-width:0;margin:0}
.contactNameRow #contactRename{flex:0 0 auto;width:auto;white-space:nowrap;margin:0;padding:9px 12px;font-size:15px;min-height:50px}
.developerReplyAlert{position:fixed;z-index:99999;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 72px);width:calc(100% - 32px);padding:16px 12px;background:#2563eb;color:white;border:1px solid #8db4ff;border-radius:18px;box-shadow:0 9px 28px #0008;font-size:17px;line-height:1.45;text-align:center}
.developerReplyAlert{position:fixed!important;top:calc(env(safe-area-inset-top,0px) + 54px)!important;left:14px!important;right:auto!important;width:44px!important;height:44px!important;min-width:44px!important;padding:0!important;display:grid!important;place-items:center!important;font-size:23px!important;line-height:1!important;border-radius:14px!important;background:#2563eb!important;color:white!important;border:1px solid #7eafff!important;box-shadow:0 5px 16px #0006!important;z-index:99999!important}
</style>
</head>
<body>
<section id="home" class="page active">
  <div class="topBar"><h1>פקעות</h1><div class="topBarActions"><button class="shareBtn" onclick="shareApp()" aria-label="שתף את האפליקציה" title="שתף את האפליקציה"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3"></path><path d="m7 8 5-5 5 5"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg></button><button class="refreshBtn" onclick="refreshList()">↻</button></div></div>
  <p id="homeHelp" class="subtitle">מועדפים למעלה. מחיקה: החלקה ימינה.</p>
  <section id="departmentManagerSummary" class="departmentManagerSummary" hidden aria-live="polite">
    <div class="managerSummaryTitle"><strong id="managerSummaryTitle">נתוני מחלקה</strong><span>מנהל מחלקה</span></div>
    <div class="managerSummaryGrid">
      <div><strong id="managerSummaryUsers">—</strong><span>משתמשים</span></div>
      <div><strong id="managerSummaryActive">—</strong><span>פעילים השבוע</span></div>
      <div><strong id="managerSummaryScans">—</strong><span>סריקות</span></div>
    </div>
  </section>
  <div class="tabs"><button id="tabLocal" class="tab active" onclick="setTab('local')">מקומי</button><button id="tabShared" class="tab" onclick="setTab('shared')">משותף</button></div>
  <div id="list" class="list"></div>
  <div class="bottom"><button onclick="showPage('newPage')">הכנס פקעה חדשה</button></div>
</section>

<section id="newPage" class="page">
  <button class="back" onclick="showPage('home')">חזור</button>
  <h1>פקעה חדשה</h1>
  <div class="saveChoiceTitle">איפה לשמור?</div>
  <div class="saveTabs"><button id="saveLocalBtn" class="saveTab" onclick="setSaveTarget('local')">מקומי</button><button id="saveSharedBtn" class="saveTab" onclick="setSaveTarget('shared')">משותף</button></div>
  <label>שם הפקעה <span class="labelHint">יש לשמור על סיווג מתאים</span></label><input id="name" autocomplete="off" maxlength="60" placeholder="תיאור בראשי תיבות">
  <div class="codeGrid"><div><label>בסיס - 8 ספרות</label><input id="codeBase" inputmode="numeric" autocomplete="off" maxlength="15" placeholder="60026342" oninput="cleanCodeFields('base')"><div id="baseCounter" class="fieldCounter">נותרו 8 ספרות</div></div><div><label>סיומת</label><input id="codeSuffix" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="004" oninput="cleanCodeFields('suffix')"></div></div>
  <label>הערות</label><textarea id="notes" maxlength="250" placeholder="לא חובה"></textarea>
  <button class="save" onclick="saveItem()">שמור</button>
  <div class="smallHelp">הברקוד נשמר כ־8 ספרות + 0000 + סיומת בת 3 ספרות.</div>
</section>

<section id="barcodePage" class="whitePage">
  <div class="barcodeWrap">
    <div class="barcodeName" id="barcodeName"></div>
    <div class="barcodeNumber" id="barcodeNumber"></div>
    <div id="barcodeSvg"></div>
    <div class="barcodeActions">
      <button class="barcodeBackBtn" onclick="showPage('home')">חזרה</button>
      <button class="barcodeScannedBtn" onclick="handleBarcodeScanned()">נסרק</button>
    </div>
  </div>
</section>

<script src="js/config.js?v=1.55"></script>
<script src="js/utils.js?v=1.55"></script>
<script src="js/storage.js?v=1.55"></script>
<script src="js/barcode.js?v=1.55"></script>
<script src="js/shared.js?v=1.55"></script>
<script src="js/stats.js?v=1.55"></script>
<script src="js/app.js?v=1.55"></script>
<script src="js/pwa-enhance.js?v=1.55"></script>
<script src="js/manager-summary.js?v=1.55"></script>
<script src="js/developer-contact.js?v=1.55"></script>
<script>

function formatLastScannedDate(value) {
  const timestamp = Number(value || 0);
  if (!timestamp) return '';
  const d = new Date(timestamp);
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const hours = String(d.getHours()).padStart(2, '0');
  const minutes = String(d.getMinutes()).padStart(2, '0');
  return `${month}/${day} ${hours}:${minutes}`;
}

function isToday(value) {
  const timestamp = Number(value || 0);
  if (!timestamp) return false;
  const d = new Date(timestamp);
  const now = new Date();
  return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
}

const originalRenderItem = renderItem;
renderItem = function(x) {
  let html = originalRenderItem(x).replace('נפתחה ', 'נסרק ');
  const scanTime = Number(x.lastScannedAt || 0);
  const correctionMatch=String(x.name||'').match(/תיקון (?:סריקה|הדפסה)/);
  const correction=correctionMatch ? escapeHtml(correctionMatch[0]) : '';
  const cleanName=escapeHtml(String(x.name||'').replace(/תיקון (?:סריקה|הדפסה)/g,'').trim());
  const visibleScan=activeTab === 'local' && scanTime && Date.now()-scanTime < 48*60*60*1000;
  const todayClass=visibleScan && isToday(scanTime) ? ' today' : '';
  const scanText=visibleScan ? `<span class="lastScannedText${todayClass}">נסרק לאחרונה: ${formatLastScannedDate(scanTime)}</span>` : '';
  html=html.replace(`<div class="itemName">${escapeHtml(x.name)}</div>`,`<div class="itemName">${cleanName}${scanText}</div>`);
  if(correction && activeTab==='local') html=html.replace('<div class="itemMeta">','<div class="itemMeta hasCorrection">').replace('<div class="num">','<span class="scanCorrectionTag">'+correction+'</span><div class="num">');
  return html;
};

async function shareApp() {
  const url = `${window.location.origin}${window.location.pathname}`;
  const instructions = 'פתח את הקישור בספארי. לאחר מכן לחץ על כפתור השיתוף ובחר „הוסף למסך הבית”.';
  const shareData = { title: 'פקע פקע', text: `אפליקציית פקע פקע\n\n${instructions}`, url };
  try {
    if (navigator.share) {
      await navigator.share(shareData);
      return;
    }
    await navigator.clipboard.writeText(`${shareData.text}\n\n${url}`);
    showAppDialog({ title: 'ההודעה הועתקה', text: 'הקישור והוראות ההתקנה הועתקו ללוח.', actions: [{ label: 'סגור' }] });
  } catch (error) {
    if (error && error.name === 'AbortError') return;
    showAppDialog({ title: 'השיתוף לא זמין', text: 'לא ניתן לפתוח את חלון השיתוף במכשיר הזה.', actions: [{ label: 'סגור' }] });
  }
}

function renderVersionHistory(history) {
  const entries = Array.isArray(history) ? history : [];
  if (!entries.length) return '<div class="versionEmpty">אין היסטוריית שינויים זמינה.</div>';
  return `<div class="versionHistory">${entries.map((entry, index) => {
    const changes = Array.isArray(entry.changes) ? entry.changes : [];
    return `<details class="versionEntry"${index === 0 ? ' open' : ''}><summary>גרסה ${escapeHtml(entry.version || '')}</summary><div class="versionChanges">${changes.map(change => `<span class="versionChange">• ${escapeHtml(change)}</span>`).join('')}</div></details>`;
  }).join('')}</div>`;
}

function closeVersionHistory() {
  const screen = document.getElementById('versionHistoryScreen');
  if (screen) screen.remove();
}

function showVersionHistory(history) {
  closeAppDialog();
  closeVersionHistory();
  const screen = document.createElement('div');
  screen.id = 'versionHistoryScreen';
  screen.className = 'versionScreen';
  screen.innerHTML = `<div class="versionScreenHeader"><h2 class="versionScreenTitle">מה חדש?</h2><button type="button" class="versionCloseBtn" onclick="closeVersionHistory()">סגור</button></div><div class="versionScreenBody">${renderVersionHistory(history)}</div>`;
  document.body.appendChild(screen);
}

async function loadVersionInfo() {
  const r = await fetch(`version.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('version fetch failed');
  return r.json();
}

checkForAppUpdate = async function(showCurrentMessage = true) {
  try {
    const info = await loadVersionInfo();
    const latest = String(info.version || '').trim();
    const history = Array.isArray(info.history) ? info.history : [];
    if (!latest) return false;
    if (isVersionNewer(latest, VERSION)) {
      showAppDialog({
        title: 'קיים עדכון חדש',
        text: `גרסה נוכחית: ${escapeHtml(VERSION)}<br>גרסה חדשה: ${escapeHtml(latest)}`,
        actions: [
          { label: 'עדכן עכשיו', onClick: () => forceAppUpdate(latest) },
          { label: 'הצג שינויים', kind: 'secondary', onClick: () => showVersionHistory(history) },
          { label: 'לא עכשיו', kind: 'secondary' }
        ]
      });
      return true;
    }
    if (showCurrentMessage) {
      showAppDialog({
        title: 'אין עדכון חדש',
        text: `אתה משתמש בגרסה העדכנית ביותר: v${escapeHtml(VERSION)}`,
        actions: [
          { label: 'הצג שינויים', onClick: () => showVersionHistory(history) },
          { label: 'סגור', kind: 'secondary' }
        ]
      });
    }
    return false;
  } catch (e) {
    if (showCurrentMessage) showAppDialog({ title: 'בדיקת העדכון נכשלה', text: 'נסה שוב מאוחר יותר.', actions: [{ label: 'סגור' }] });
    return false;
  }
};

function handleBarcodeScanned() {
  const el = document.getElementById('barcodeNumber');
  const nameEl = document.getElementById('barcodeName');
  const barcode = el ? el.textContent : '';
  const name = nameEl ? nameEl.textContent : '';
  if (el) incrementLocalScanCountByCode(barcode);
  if (typeof recordPakapakaScan === 'function') recordPakapakaScan({ barcode, name });
  showPage('home');
}

showDepartmentRequired = function() {
  const list = document.getElementById('list');
  if (!list) return;
  list.innerHTML = '<div class="empty departmentRequiredBox" onclick="changeDepartment()">לא נבחרה מחלקה לרשימה המשותפת.<br>לחץ כאן כדי להכניס מספר מחלקה.</div>';
};

renderList();
if (typeof activeTab !== 'undefined' && activeTab === 'shared' && !getDepartment()) showDepartmentRequired();
</script>
</body>
</html>
