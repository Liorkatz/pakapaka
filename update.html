<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>עדכון פקע פקע</title><style>html,body{background:#080808;color:white;font-family:Arial,sans-serif}main{max-width:480px;margin:20vh auto;padding:24px;text-align:center}button{background:#fff;color:#000;border:0;border-radius:14px;padding:16px;width:100%;font-size:18px}</style></head><body><main><h1>עדכון פקע פקע</h1><p id="status">מרענן את קובצי האפליקציה...</p><button id="retry" hidden>נסה שוב</button></main><script>
async function update(){
 const status=document.getElementById('status');
 try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
  if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
  status.textContent='פותח את הגרסה החדשה...';
  location.replace('./index.html?v=1.65&reload='+Date.now());
 }catch(err){status.textContent='לא ניתן לרענן אוטומטית. אפשר לנסות שוב.';document.getElementById('retry').hidden=false;}
}
document.getElementById('retry').onclick=update;
update();
</script></body></html>
